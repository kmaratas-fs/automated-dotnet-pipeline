user nginx;
worker_processes auto;

# /dev/stderr means that error logs will be sent to the standard error stream, 
# which is useful in containerized environments like Docker, where logs are typically collected from the container's stdout and stderr streams.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Access and error logsm stdout means they will be captured by Docker and can be viewed using `docker logs`
    access_log /dev/stdout main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression for better performance example is enabled for common text-based content types and font files
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Upstream API server, upstream means that it will load balance requests to the 
    # specified backend servers, in this case, the dotnet-api service running on port 8080. 
    # The least_conn directive tells Nginx to send requests to the server with the least number of active connections,
    # which can help distribute load more evenly.
    upstream dotnet_api {
        least_conn;
        server dotnet-api:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Include additional configuration files
    include /etc/nginx/conf.d/*.conf;
}
