name: Build and Deploy API 

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PRODUCTION_API_URL: https://143.198.213.161/health
  # Must match the image in docker-compose.prod.yml (used for rollback tagging)
  API_IMAGE: ghcr.io/kmaratas-fs/automated-dotnet-pipeline:latest
  VPS_API_URL: http://localhost:8080/health

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      # Builds my Docker image using the Dockerfile in the root of the repository and pushes it to GitHub Container Registry with the tags generated by the metadata action. 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd automated-dotnet-pipeline/

            IMAGE=${{ env.API_IMAGE }}

            # --- Login to ghcr using PAT
            echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u kmaratas-fs --password-stdin

            # --- Pull latest files
            git pull origin main

            # --- Remember the image ID currently tagged :latest so we can roll back to it.
            # --- Empty on the very first deploy (nothing to roll back to).
            PREVIOUS_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE" 2>/dev/null || echo "")
            echo "[INFO] Previous image: ${PREVIOUS_IMAGE_ID:-<none>}"

            # --- Keep the old image reachable by its own tag, so `pull` moving :latest
            # --- (and a later prune of dangling images) can't take it away from us.
            if [ -n "$PREVIOUS_IMAGE_ID" ]; then
              docker tag "$PREVIOUS_IMAGE_ID" "${IMAGE%:*}:rollback"
            fi

            # --- Pull latest Docker image
            docker compose -f docker-compose.prod.yml pull

            # --- Recreate containers using new images
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # --- Wait for API to be healthy locally
            set +e
            HEALTHY=0
            for i in {1..30}; do
              if curl -f ${{ env.VPS_API_URL }} > /dev/null 2>&1; then
                echo "[SUCCESS] API is healthy"
                HEALTHY=1
                break
              fi
              echo "[INFO] Waiting for API to be healthy... ($i/30)"
              sleep 2
            done

            if [ "$HEALTHY" = "1" ]; then
              exit 0
            fi


            # --- Rollback to previous image if the new one fails to become healthy
            echo "[FAILED] API failed to become healthy"
            docker compose -f docker-compose.prod.yml logs --tail=200 dotnet-api

            if [ -z "$PREVIOUS_IMAGE_ID" ]; then
              echo "[FAILED] No previous image to roll back to"
              exit 1
            fi

            echo "[ROLLBACK] Restoring previous image $PREVIOUS_IMAGE_ID"
            docker tag "$PREVIOUS_IMAGE_ID" "$IMAGE"
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Verify the rollback itself came back healthy
            for i in {1..30}; do
              if curl -f ${{ env.VPS_API_URL }} > /dev/null 2>&1; then
                echo "[ROLLBACK] Previous version is healthy again"
                exit 1
              fi
              echo "[ROLLBACK] Waiting for previous version... ($i/30)"
              sleep 2
            done

            echo "[FAILED] Rollback did not become healthy either"
            docker compose -f docker-compose.prod.yml logs --tail=200 dotnet-api
            exit 1
    
  check_api_health_production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check API health in production
        run: |
          for i in {1..30}; do
            if curl -f ${{ env.PRODUCTION_API_URL }} > /dev/null 2>&1; then
              echo "[SUCCESS] API is healthy"
              exit 0
            fi
            echo "[INFO] Waiting for API to be healthy... ($i/30)"
            sleep 2
          done
          echo "[FAILED] API failed to become healthy"
          exit 1